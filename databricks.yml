bundle:
  name: agent_langgraph_advanced_genie
  engine: direct

resources:
  apps:
    agent_langgraph_advanced_genie:
      name: "agent-genie-app"
      description: "LangGraph agent application with short-term and long-term memory"
      source_code_path: ./
      user_api_scopes:
        - mcp.genie
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          - name: LAKEBASE_AUTOSCALING_ENDPOINT
            value_from: "postgres"
          - name: DATABRICKS_EMBEDDING_ENDPOINT
            value: "databricks-gte-large-en"

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: "2615905400528742"
            permission: 'CAN_MANAGE'
        - name: 'postgres'
          postgres:
            branch: "projects/agent-genie-lakebase/branches/agent-genie-lakebase-branch"
            database: "projects/agent-genie-lakebase/branches/agent-genie-lakebase-branch/databases/databricks-postgres"
            permission: 'CAN_CONNECT_AND_CREATE'
        - name: nyc_taxi_genie
          genie_space:
            name: nyc-taxi-genie
            space_id: 01f153cb61361d95829b8ad8bd1bb931
            permission: CAN_RUN
targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        agent_langgraph_advanced:
          name: agent-langgraph-advanced
